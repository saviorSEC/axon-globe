<title>AXON GLOBE — Infrastructure Map</title>
<style>

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--text);

  #globe{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;top:18px;left:18px;z-index:10;pointer-events:none}
  .hud .title{font-size:16px;font-weight:700;letter-spacing:2px;color:#eaf4ee}
  .hud .sub{font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:4px;text-transform:uppercase}
  .hud .badge{display:inline-block;margin-top:10px;padding:3px 8px;font-size:9px;letter-spacing:2px;
    border:1px solid var(--accent2);color:var(--accent2);border-radius:2px}
  .stats{position:fixed;top:18px;right:18px;z-index:10;text-align:right;pointer-events:none}

  .stats .lbl{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  #search{position:fixed;top:90px;right:18px;z-index:10;width:240px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:6px;
    font-family:inherit;font-size:11px;letter-spacing:1px;outline:none;backdrop-filter:blur(6px)}
  #search:focus{border-color:var(--accent)}
  #legend{position:fixed;bottom:18px;left:18px;z-index:10;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:9.5px;
    letter-spacing:1px;backdrop-filter:blur(6px);max-width:240px}
  #legend .h{color:var(--accent);letter-spacing:2px;margin-bottom:8px;font-size:10px}
  #legend div{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--dim)}
  #legend i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor;flex-shrink:0}
  #legend .globe-link{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  #legend a{color:var(--accent);text-decoration:none;font-size:9.5px;letter-spacing:1.5px}
  #detail{position:fixed;bottom:18px;right:18px;z-index:20;width:330px;max-height:60vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
    display:none;backdrop-filter:blur(8px);font-size:11px;line-height:1.6}
  #detail .dt{font-size:13px;font-weight:700;color:#eaf4ee;margin-bottom:2px}
  #detail .dz{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
  #detail .kv{display:flex;gap:10px;margin:5px 0}
  #detail .k{color:var(--dim);flex-shrink:0;min-width:70px;text-transform:uppercase;font-size:9px;letter-spacing:1px;padding-top:2px}
  #detail .v{color:var(--text);word-break:break-word}
  #detail .close{position:absolute;top:8px;right:10px;color:var(--dim);cursor:pointer;font-size:14px;background:none;border:none}
  #detail .close:hover{color:var(--accent)}
  .tip{position:fixed;z-index:30;pointer-events:none;background:rgba(4,6,12,.92);border:1px solid var(--line);
    padding:8px 12px;font-size:10px;letter-spacing:1px;border-radius:4px;display:none;max-width:320px}
  .tip .t{color:#eaf4ee;font-weight:700;font-size:11px;margin-bottom:3px}
  .tip .s{color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:2px}
  #noresults{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dim);
    font-size:11px;letter-spacing:2px;display:none;z-index:15;text-transform:uppercase}
</style>
</head>

-commander", "z-core"], ["s-evidence-auth", "z-identity"], ["s-dedrone-api", "z-acquired"], ["s-devops-secrets", "z-devops"], ["s-community", "z-corp"], ["s-vpn", "z-corp"], ["s-evidence-main", "s-www"], ["s-rapidsos", "z-ecosystem"], ["s-s3-static", "z-corp"], ["s-flock", "s-evidence-main"], ["s-devops-other", "z-devops"], ["s-fusus-assist", "z-acquired"], ["s-devops-mesh", "z-devops"], ["s-evidence-main", "s-evidence-api"], ["s-evidence-status", "z-core"], ["s-3si", "s-flock"], ["s-evidence-main", "s-evidence-id"], ["s-dedrone-soc", "z-acquired"]]}

const zones = Object.fromEntries(ARCHIVE.zones.map(z => [z.id, z]));
const services = ARCHIVE.services;
const links = ARCHIVE.links;

// ---- geographic anchors (from DNS + IP geolocation, 2026-08-19) ----
const GEO = {
  "s-evidence-main":    {lat:36.65, lng:-78.38},
  "s-evidence-id":      {lat:36.68, lng:-78.41},
  "s-evidence-api":     {lat:36.62, lng:-78.35},
  "s-evidence-upload":  {lat:36.70, lng:-78.33},
  "s-evidence-admin":   {lat:36.66, lng:-78.43},
  "s-evidence-status":  {lat:36.63, lng:-78.45},
  "s-evidence-docs":    {lat:36.72, lng:-78.30},
  "s-evidence-dev":     {lat:36.60, lng:-78.47},
  "s-evidence-mail":    {lat:36.68, lng:-78.27},
  "s-evidence-local":   {lat:36.74, lng:-78.36},
  "s-evidence-regions": {lat:36.58, lng:-78.42},
  "s-commander":        {lat:36.67, lng:-78.48},
  "s-jenkins":          {lat:36.61, lng:-78.28},
  "s-devops-tools":     {lat:36.64, lng:-78.25},
  "s-devops-secrets":   {lat:36.59, lng:-78.31},
  "s-devops-mesh":      {lat:36.71, lng:-78.24},
  "s-devops-data":      {lat:36.57, lng:-78.34},
  "s-devops-other":     {lat:36.69, lng:-78.22},
  "s-iot":              {lat:38.95, lng:-77.35},
  "s-my":               {lat:39.04, lng:-77.49},
  "s-salesforce":       {lat:39.02, lng:-77.52},
  "s-vpn":              {lat:33.51, lng:-111.90},
  "s-www":              {lat:33.53, lng:-111.95},
  "s-stage":            {lat:45.85, lng:-119.70},
  "s-help":             {lat:33.48, lng:-111.86},
  "s-academy":          {lat:37.77, lng:-122.42},
  "s-s3-static":        {lat:37.80, lng:-122.39},
  "s-c2":               {lat:47.61, lng:-122.33},
  "s-dedrone":          {lat:37.77, lng:-122.42},
  "s-dedrone-api":      {lat:50.11, lng:8.68},
  "s-dedrone-c2":       {lat:47.61, lng:-122.33},
  "s-fusus-eur":        {lat:53.35, lng:-6.26},
  "s-fusus":            {lat:33.75, lng:-84.39},
  "s-fusus-de":         {lat:50.14, lng:8.70},
  "s-assist":           {lat:47.58, lng:-122.36},
  "s-carbyne":          {lat:32.08, lng:34.78},
  "s-3si":              {lat:37.34, lng:-121.89},
  "s-rapidsos":         {lat:45.90, lng:-119.75},
  "s-flock":            {lat:33.75, lng:-84.39},
  "s-community":        {lat:39.06, lng:-77.46},
  "s-cloudflare":       {lat:33.55, lng:-111.98},
  "s-azure":            {lat:36.65, lng:-78.38},
  "s-aws":              {lat:39.0, lng:-77.5},
  "s-proofpoint":       {lat:34.05, lng:-118.24},
  "s-dedrone-gitlab":   {lat:50.11, lng:8.66},
  "s-dedrone-quarkus":  {lat:50.08, lng:8.72},
  "s-dedrone-icinga":   {lat:50.13, lng:8.63},
  "s-dedrone-s3":       {lat:50.09, lng:8.69},
  "s-dedrone-soc":      {lat:50.15, lng:8.60},
  "s-dedrone-adsb":     {lat:50.12, lng:8.64}
};

// jitter same-region points so clusters are readable
const seen = {};
services.forEach(s => {
  const g = GEO[s.id] || {lat:0, lng:0};
  const key = g.lat.toFixed(1) + "," + g.lng.toFixed(1);
  const n = (seen[key] = (seen[key] || 0) + 1);
  s._lat = g.lat + (n - 1) * 0.12;
  s._lng = g.lng + (n - 1) * 0.12;
});

const colorOf = s => zones[s.zone] ? zones[s.zone].color : "#94a3b8";
const sizeOf = s => {
  if (s.role.includes("MAIN") || s.role.includes("OIDC") || s.role.includes("C2")) return 0.9;
  if (s.role.includes("GATEWAY") || s.role.includes("PORTAL")) return 0.65;
  return 0.42;
};

const globe = Globe()
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundColor('#04060c')
  .pointOfView({lat: 38, lng: -80, altitude: 1.9});

// arcs between linked services (that both have geo)
const arcs = [];
links.forEach(l => {
  const a = services.find(s => s.id === l[0]);
  const b = services.find(s => s.id === l[1]);
  if (!a || !b) return;
  const ga = GEO[a.id], gb = GEO[b.id];
  if (!ga || !gb) return;
  if (Math.abs(ga.lat - gb.lat) < 0.3 && Math.abs(ga.lng - gb.lng) < 0.3) return; // skip same-region
  arcs.push({startLat: ga.lat, startLng: ga.lng, endLat: gb.lat, endLng: gb.lng,
             color: a === b ? zones[a.zone].color : colorOf(a),
             service: a.name});
});
globe.arcsData(arcs)
  .arcColor(d => d.color)
  .arcDashLength(0.35)
  .arcDashGap(2.5)
  .arcDashAnimateTime(2200)
  .arcStroke(0.32)
  .arcAltitudeAutoScale(0.28);

globe(document.getElementById('globe'))
  .pointsData(services)
  .pointLat(d => d._lat)
  .pointLng(d => d._lng)
  .pointColor(d => colorOf(d))
  .pointAltitude(d => sizeOf(d))
  .pointRadius(d => sizeOf(d) * 0.55)
  .pointLabel(d => `<div style="font-family:monospace;font-size:11px;letter-spacing:1px"><b style="color:${colorOf(d)}">${d.name}</b><br><span style="color:#5b6b78;font-size:9px;text-transform:uppercase;letter-spacing:2px">${zones[d.zone].name}</span></div>`)
  .onPointClick(d => openDetail(d))
  .onPointHover(h => {
    const tip = document.getElementById('tip');
    if (h) {
      tip.style.display = 'block';
      tip.innerHTML = `<div class="t" style="color:${colorOf(h)}">${h.name}</div><div class="s">${zones[h.zone].name}</div>`;
    } else tip.style.display = 'none';
  });

globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.5;
globe.controls().addEventListener('start', () => { globe.controls().autoRotate = false; });

// pulse
const pulse = () => {
  const t = Date.now() / 1000;
  globe.pointAltitude(d => sizeOf(d) * (0.6 + 0.4 * Math.sin(t * 2 + d.id.length)));
  requestAnimationFrame(pulse);
};
pulse();

// open detail
const openDetail = s => {
  const z = zones[s.zone];
  const ep = (s.endpoints || []).map(e => `<div class="kv"><span class="k">Path</span><span class="v">${e}</span></div>`).join("");
  const dns = (s.dns || []).map(d => `<div class="kv"><span class="k">DNS</span><span class="v">${d}</span></div>`).join("");
  const keys = (s.keys || []).map(k => `<div class="kv"><span class="k">Key</span><span class="v" style="color:var(--accent2)">${k}</span></div>`).join("");
  document.getElementById('detail-body').innerHTML = `
    <div class="dt">${s.name}</div>
    <div class="dz" style="color:${z.color}">${z.name}</div>
    <div class="kv"><span class="k">Role</span><span class="v">${s.role}</span></div>
    <div class="kv"><span class="k">Note</span><span class="v">${s.note || "—"}</span></div>
    <div class="kv"><span class="k">Loc</span><span class="v">${s._lat.toFixed(2)}, ${s._lng.toFixed(2)}</span></div>
    ${ep}${dns}${keys}`;
  document.getElementById('detail').style.display = 'block';
};

// legend + stats
document.getElementById('zone-list').innerHTML = ARCHIVE.zones.map(z =>
  `<div><i style="color:${z.color};background:${z.color}"></i><span><b style="color:var(--text)">${z.name.split("//")[0].trim()}</b> — ${z.name.split("//")[1] || ""}</span></div>`).join("");
document.getElementById('st-s').textContent = services.length;
document.getElementById('st-z').textContent = ARCHIVE.zones.length;
document.getElementById('st-l').textContent = links.length;

// search filter
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  const vis = services.filter(s => !q || s.name.toLowerCase().includes(q) || s.role.toLowerCase().includes(q));
  globe.pointsData(vis).pointRadius(d => sizeOf(d) * 0.55);
  document.getElementById('noresults').style.display = vis.length ? 'none' : 'block';
});

// tooltip follow
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip');
  if (tip.style.display === 'block') {
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  }
});
</script>
